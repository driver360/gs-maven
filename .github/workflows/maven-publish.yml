name: Maven Package

on:
  release:
    types: [created]
    
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Build & Deploy
        run: ./mvnw -B deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
